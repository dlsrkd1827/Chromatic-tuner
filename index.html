<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chromatic Tuner</title>
<style>
  :root{
    --bg:#141210;
    --bg2:#1c1815;
    --grille:#0d0b0a;
    --amber:#FFB627;
    --amber-dim:#7a5a12;
    --green:#5EEA6B;
    --red:#FF4B3E;
    --text:#EFE7DA;
    --text-dim:#8a8078;
    --mono: 'Courier New', ui-monospace, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #2a2420 0%, var(--bg) 60%);
    color:var(--text);
    font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif;
    overflow:hidden;
    touch-action:manipulation;
  }
  .stage{
    height:100dvh; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:0.25em;
    color:var(--text-dim); text-transform:uppercase; margin-top:4px;
  }
  .meter-wrap{
    width:100%; max-width:420px;
    display:flex; flex-direction:column; align-items:center;
    margin-top:6px;
  }
  svg{ width:100%; height:auto; overflow:visible; }
  .tick{ stroke:var(--text-dim); stroke-width:2; }
  .tick.center{ stroke:var(--amber-dim); stroke-width:3; }
  .needle{
    transform-origin: 200px 190px;
    transition: transform 90ms ease-out;
  }
  .note-name{
    font-size: 96px; font-weight:800; letter-spacing:-0.02em;
    color:var(--amber); line-height:1;
    text-shadow: 0 0 24px rgba(255,182,39,0.35);
    font-variant-numeric: tabular-nums;
    transition: color 120ms ease;
  }
  .note-name.in-tune{ color:var(--green); text-shadow:0 0 28px rgba(94,234,107,0.5); }
  .octave{
    font-size:34px; font-weight:400; color:var(--text-dim); vertical-align:top; margin-left:2px;
  }
  .cents-row{
    font-family:var(--mono); font-size:15px; color:var(--text-dim);
    display:flex; gap:18px; align-items:center; margin-top:2px;
  }
  .cents-row .val{ color:var(--text); }
  .detected-row{
    display:none; font-family:var(--mono); font-size:14px; color:var(--text-dim); margin-top:2px;
  }
  .detected-row.show{ display:block; }
  .detected-row .val{ color:var(--amber); font-weight:700; }
  .freq{
    font-family:var(--mono); font-size:13px; color:var(--text-dim); margin-top:10px; letter-spacing:0.05em;
  }
  .panel{
    width:100%; max-width:420px;
    background:var(--grille);
    border:1px solid #2a2420;
    border-radius:16px;
    padding:16px 18px;
    display:flex; flex-direction:column; gap:14px;
  }
  .row{ display:flex; align-items:center; justify-content:space-between; }
  #octave-row{ display:none; }
  #octave-row.show{ display:flex; }
  .row label{ font-size:13px; color:var(--text-dim); font-family:var(--mono); }
  .row .a4-controls{ display:flex; align-items:center; gap:10px; font-family:var(--mono); }
  .row .a4-controls button{
    width:30px; height:30px; border-radius:8px; border:1px solid #35302a;
    background:#211d19; color:var(--text); font-size:16px; cursor:pointer;
  }
  .row .a4-controls span{ min-width:44px; text-align:center; color:var(--amber); font-size:14px; }
  .startbtn{
    width:100%; padding:16px; border-radius:14px; border:none;
    background: linear-gradient(180deg, #2a2420, #1a1512);
    border:1px solid #3a332c;
    color:var(--amber); font-size:16px; font-weight:700; letter-spacing:0.04em;
    cursor:pointer;
  }
  .startbtn.on{
    background: linear-gradient(180deg, #3a2e12, #241c0c);
    border-color:var(--amber-dim);
  }
  .hint{ font-size:11px; color:var(--text-dim); text-align:center; line-height:1.5; }
  .mode-toggle{
    display:flex; gap:8px; background:#100d0b; border-radius:12px; padding:4px;
  }
  .mode-toggle button{
    flex:1; padding:10px 8px; border-radius:9px; border:none; background:transparent;
    color:var(--text-dim); font-size:13px; font-family:var(--mono); cursor:pointer;
  }
  .mode-toggle button.active{
    background:#2a2420; color:var(--amber); box-shadow: inset 0 0 0 1px var(--amber-dim);
  }
  .target-row{
    display:none; align-items:center; justify-content:center; gap:18px;
  }
  .target-row.show{ display:flex; }
  .target-row button{
    width:44px; height:44px; border-radius:12px; border:1px solid #35302a;
    background:#211d19; color:var(--amber); font-size:20px; cursor:pointer;
  }
  .target-row button#target-play{ font-size:13px; width:52px; }
  .target-row button#target-play.playing{
    background:linear-gradient(180deg, #3a2e12, #241c0c);
    border-color:var(--amber-dim); color:var(--green);
  }
  .target-display{ text-align:center; font-family:var(--mono); }
  .target-display .tname{ font-size:26px; font-weight:700; color:var(--amber); }
  .target-display .tfret{ font-size:10px; color:var(--text-dim); letter-spacing:0.15em; margin-top:2px; }
  .status-dot{
    width:8px; height:8px; border-radius:50%; background:var(--text-dim); display:inline-block; margin-right:6px;
  }
  .status-dot.live{ background:var(--red); box-shadow:0 0 8px var(--red); }
</style>
</head>
<body>
<div class="stage">
  <div class="eyebrow">CHROMATIC TUNER · A4 = <span id="a4-eyebrow">440</span>Hz</div>

  <div class="meter-wrap">
    <svg viewBox="0 0 400 220">
      <!-- scale ticks -50..+50 cents -->
      <g id="ticks"></g>
      <!-- needle -->
      <line id="needle" class="needle" x1="200" y1="190" x2="200" y2="40" stroke="var(--amber)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="200" cy="190" r="7" fill="var(--amber)"/>
    </svg>

    <div>
      <span id="note" class="note-name">--</span><span id="octave" class="octave"></span>
    </div>
    <div class="cents-row">
      <span><span class="status-dot" id="statusdot"></span>대기중</span>
      <span>cents <span class="val" id="cents">0</span></span>
    </div>
    <div class="detected-row" id="detected-row">감지된 음 <span class="val" id="detected-note">--</span></div>
    <div class="freq" id="freq">0.0 Hz</div>
  </div>

  <div class="panel">
    <div class="mode-toggle" id="inst-toggle">
      <button id="inst-guitar" class="active">기타 E2~</button>
      <button id="inst-bass">베이스 E1~</button>
    </div>

    <div class="mode-toggle">
      <button id="mode-auto" class="active">자동 감지</button>
      <button id="mode-target">타겟 지정</button>
    </div>

    <div class="target-row" id="target-row">
      <button id="target-prev">◀</button>
      <div class="target-display">
        <div class="tname" id="target-name">E2</div>
        <div class="tfret" id="target-fret">NO.1 · +0반음</div>
      </div>
      <button id="target-next">▶</button>
      <button id="target-play" title="기준음 듣기">재생</button>
    </div>

    <div class="row" id="octave-row">
      <label>재생 옥타브</label>
      <div class="a4-controls">
        <button id="oct-down">–</button>
        <span id="oct-val">+0</span>
        <button id="oct-up">+</button>
      </div>
    </div>

    <div class="row">
      <label>기준 피치 (A4)</label>
      <div class="a4-controls">
        <button id="a4down">–</button>
        <span id="a4val">440</span>
        <button id="a4up">+</button>
      </div>
    </div>
    <button class="startbtn" id="startbtn">마이크 시작</button>
    <div class="hint" id="hint">전체 음역대(약 E1~C6)에서 가장 가까운 반음을 자동으로 잡습니다.<br>기타 줄 이름이 아닌 순수 음이름(C, C#, D…)으로 표시됩니다.</div>
  </div>
</div>

<script>
(function(){
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  let a4 = 440;
  let audioCtx, analyser, mediaStream, rafId;
  let running = false;
  let mode = 'auto'; // 'auto' | 'target'
  let inst = 'guitar';
  // guitar: E2(40) .. G5(79) — the 40-note table
  // bass:   E1(28) .. G3(55) — 4-string bass, open low E up through the G string
  const RANGES = { guitar:{lo:40, hi:79}, bass:{lo:28, hi:55} };
  let targetMidi = RANGES.guitar.lo;
  let playOctave = 0; // reference-tone octave shift, for audibility on small speakers

  function midiToName(midi){
    const name = NOTE_NAMES[((midi % 12)+12)%12];
    const octave = Math.floor(midi/12) - 1;
    return {name, octave};
  }
  function midiToFreq(midi){
    return a4 * Math.pow(2, (midi-69)/12);
  }

  const noteEl = document.getElementById('note');
  const octEl = document.getElementById('octave');
  const centsEl = document.getElementById('cents');
  const freqEl = document.getElementById('freq');
  const needle = document.getElementById('needle');
  const startbtn = document.getElementById('startbtn');
  const statusdot = document.getElementById('statusdot');
  const a4valEl = document.getElementById('a4val');
  const a4eyebrow = document.getElementById('a4-eyebrow');
  const modeAutoBtn = document.getElementById('mode-auto');
  const modeTargetBtn = document.getElementById('mode-target');
  const targetRow = document.getElementById('target-row');
  const targetNameEl = document.getElementById('target-name');
  const targetFretEl = document.getElementById('target-fret');
  const hintEl = document.getElementById('hint');
  const detectedRow = document.getElementById('detected-row');
  const detectedNoteEl = document.getElementById('detected-note');
  const instGuitarBtn = document.getElementById('inst-guitar');
  const instBassBtn = document.getElementById('inst-bass');
  const octaveRow = document.getElementById('octave-row');
  const octValEl = document.getElementById('oct-val');

  // build tick marks (-50 to +50 cents, needle sweeps -45deg to +45deg)
  const ticksG = document.getElementById('ticks');
  for(let c=-50; c<=50; c+=10){
    const angle = (c/50) * 45; // deg
    const rad = (angle-90) * Math.PI/180;
    const cx=200, cy=190, rOuter=150, rInner = (c===0? 128:136);
    const x1 = cx + rOuter*Math.cos(rad), y1 = cy + rOuter*Math.sin(rad);
    const x2 = cx + rInner*Math.cos(rad), y2 = cy + rInner*Math.sin(rad);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1); line.setAttribute('y1',y1);
    line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    line.setAttribute('class', c===0 ? 'tick center' : 'tick');
    ticksG.appendChild(line);
  }

  function freqToNote(freq){
    const midi = 69 + 12*Math.log2(freq/a4);
    const rounded = Math.round(midi);
    const cents = Math.round((midi - rounded) * 100);
    const name = NOTE_NAMES[((rounded % 12)+12)%12];
    const octave = Math.floor(rounded/12) - 1;
    return {name, octave, cents, midi: rounded};
  }

  // NSDF (McLeod Pitch Method) — normalized autocorrelation.
  // Picking the FIRST peak that clears 0.9*maxPeak is what prevents octave errors
  // in both directions (harmonic picked instead of fundamental, and vice versa).
  function autoCorrelate(buf, sampleRate){
    const SIZE = buf.length;
    let rms = 0;
    for(let i=0;i<SIZE;i++){ rms += buf[i]*buf[i]; }
    rms = Math.sqrt(rms/SIZE);
    if(rms < 0.01) return -1; // too quiet

    const minLag = Math.max(2, Math.floor(sampleRate/1300));
    const maxLag = Math.min(SIZE-2, Math.ceil(sampleRate/35)); // 35Hz floor covers bass E1 (41.2Hz)

    const nsdf = new Float64Array(maxLag+2);
    for(let tau=minLag; tau<=maxLag; tau++){
      let r=0, m=0;
      const n = SIZE - tau;
      for(let i=0;i<n;i++){
        r += buf[i]*buf[i+tau];
        m += buf[i]*buf[i] + buf[i+tau]*buf[i+tau];
      }
      nsdf[tau] = m>0 ? (2*r/m) : 0;
    }

    // local maxima following a positive-going zero crossing
    const peaks = [];
    let tau = minLag;
    while(tau < maxLag && nsdf[tau] > 0) tau++;
    while(tau < maxLag){
      if(nsdf[tau] > 0 && nsdf[tau] >= nsdf[tau-1]){
        while(tau < maxLag && nsdf[tau] >= nsdf[tau-1]) tau++;
        peaks.push(tau-1);
        while(tau < maxLag && nsdf[tau] <= 0) tau++;
      } else tau++;
    }
    if(!peaks.length) return -1;

    let maxPeak = 0;
    for(const p of peaks) if(nsdf[p] > maxPeak) maxPeak = nsdf[p];
    if(maxPeak < 0.3) return -1; // no clear periodicity (noise / muted string)

    let chosen = peaks[0];
    for(const p of peaks){ if(nsdf[p] >= 0.9*maxPeak){ chosen = p; break; } }

    let T0 = chosen;
    const y1=nsdf[T0-1], y2=nsdf[T0], y3=nsdf[T0+1];
    const a=(y1+y3-2*y2)/2, b=(y3-y1)/2;
    if(a) T0 = T0 - b/(2*a);

    const freq = sampleRate/T0;
    if(freq < 35 || freq > 1300) return -1;
    return freq;
  }

  // smoothing: require the detected note to be stable across recent frames
  // before trusting it, so single-frame octave glitches don't flash on screen.
  const recentMidi = [];
  function stabilize(rawMidi){
    recentMidi.push(rawMidi);
    if(recentMidi.length > 6) recentMidi.shift();
    if(recentMidi.length < 3) return rawMidi;
    const counts = {};
    let bestVal=rawMidi, bestCount=0;
    for(const m of recentMidi){
      counts[m] = (counts[m]||0)+1;
      if(counts[m]>bestCount){ bestCount=counts[m]; bestVal=m; }
    }
    return bestVal;
  }

  function foldToOctave(freq, refFreq){
    // shift freq by octaves until it sits within one octave of refFreq —
    // corrects stray octave-detection errors once we trust refFreq's note.
    while(freq < refFreq/Math.SQRT2) freq *= 2;
    while(freq > refFreq*Math.SQRT2) freq /= 2;
    return freq;
  }

  function updateDisplay(freq){
    if(freq<0){
      statusdot.classList.remove('live');
      recentMidi.length = 0;
      return;
    }
    statusdot.classList.add('live');
    freqEl.textContent = freq.toFixed(1) + ' Hz';

    let cents, name, octave;
    const rawMidi = Math.round(69 + 12*Math.log2(freq/a4));
    const stableMidi = stabilize(rawMidi);
    const stableNote = midiToName(stableMidi);

    if(mode === 'target'){
      const targetFreq = midiToFreq(targetMidi);
      const adjusted = foldToOctave(freq, targetFreq);
      cents = Math.round(1200 * Math.log2(adjusted/targetFreq));
      const t = midiToName(targetMidi);
      name = t.name; octave = t.octave;
      detectedNoteEl.textContent = stableNote.name + stableNote.octave;
    } else {
      const refFreq = midiToFreq(stableMidi);
      const adjusted = foldToOctave(freq, refFreq);
      cents = Math.round(1200 * Math.log2(adjusted/refFreq));
      name = stableNote.name; octave = stableNote.octave;
    }

    noteEl.textContent = name;
    octEl.textContent = octave;
    centsEl.textContent = (cents>0? '+':'') + cents;

    const inTune = Math.abs(cents) <= 5;
    noteEl.classList.toggle('in-tune', inTune);

    const clamped = Math.max(-50, Math.min(50, cents));
    const angle = clamped / 50 * 45;
    needle.setAttribute('transform', `rotate(${angle} 200 190)`);
    needle.setAttribute('stroke', inTune ? 'var(--green)' : 'var(--amber)');
  }

  function loop(){
    const buf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    const freq = autoCorrelate(buf, audioCtx.sampleRate);
    updateDisplay(freq);
    rafId = setTimeout(loop, 60); // ~16fps is plenty for a tuner and eases CPU load
  }

  async function start(){
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(mediaStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 8192; // long enough window to resolve bass E1 (41.2Hz) reliably
      source.connect(analyser);
      running = true;
      recentMidi.length = 0;
      startbtn.textContent = '중지';
      startbtn.classList.add('on');
      loop();
    }catch(e){
      alert('마이크 접근에 실패했습니다: ' + e.message);
    }
  }

  function stop(){
    running = false;
    if(rafId) clearTimeout(rafId);
    if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
    if(audioCtx) audioCtx.close();
    startbtn.textContent = '마이크 시작';
    startbtn.classList.remove('on');
    statusdot.classList.remove('live');
    noteEl.textContent='--'; octEl.textContent=''; centsEl.textContent='0'; freqEl.textContent='0.0 Hz';
    needle.setAttribute('transform','rotate(0 200 190)');
  }

  startbtn.addEventListener('click', ()=>{ running ? stop() : start(); });

  document.getElementById('a4up').addEventListener('click', ()=>{
    a4 = Math.min(480, a4+1); a4valEl.textContent=a4; a4eyebrow.textContent=a4;
  });
  document.getElementById('a4down').addEventListener('click', ()=>{
    a4 = Math.max(400, a4-1); a4valEl.textContent=a4; a4eyebrow.textContent=a4;
  });

  // reference tone playback — a plain sine wave at the target frequency,
  // on its own AudioContext so it works whether or not the mic is running.
  // Declared before renderTarget() because that function calls updateRefTone().
  let refAudioCtx = null, refNodes = null, refPlaying = false;
  const targetPlayBtn = document.getElementById('target-play');

  function renderTarget(){
    const t = midiToName(targetMidi);
    targetNameEl.textContent = t.name + t.octave;
    const idx = targetMidi - RANGES[inst].lo + 1;
    targetFretEl.textContent = 'NO.' + idx + ' · +' + (targetMidi - RANGES[inst].lo) + '반음';
    updateRefTone();
  }
  renderTarget();

  document.getElementById('target-prev').addEventListener('click', ()=>{
    targetMidi = Math.max(RANGES[inst].lo, targetMidi-1); renderTarget();
  });
  document.getElementById('target-next').addEventListener('click', ()=>{
    targetMidi = Math.min(RANGES[inst].hi, targetMidi+1); renderTarget();
  });

  // A pure sine at 41Hz (low E on bass) is nearly inaudible on a phone speaker —
  // the driver physically can't move enough air that low. So the reference tone is
  // built from a fundamental PLUS harmonics: even when the speaker drops the
  // fundamental, the harmonic series still conveys the pitch (missing-fundamental
  // effect). Lower notes also get more gain and more harmonic content.
  function buildRefTone(freq){
    const ctx = refAudioCtx;
    const master = ctx.createGain();

    // low notes need more help: more partials, louder
    const lowness = Math.max(0, Math.min(1, (220 - freq) / 180)); // 0 at 220Hz+, 1 at 40Hz
    const partialCount = Math.round(4 + lowness * 6);             // 4 .. 10 partials
    const baseGain = 0.16 + lowness * 0.30;                        // 0.16 .. 0.46

    const oscs = [];
    for(let h=1; h<=partialCount; h++){
      const f = freq * h;
      if(f > 6000) break;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, ctx.currentTime);
      // fundamental kept modest for low notes (speaker can't render it anyway),
      // harmonics carry the audible pitch
      let amp;
      if(h === 1) amp = 1.0 - lowness * 0.45;
      else amp = (1 / Math.pow(h, 0.85)) * (0.5 + lowness * 0.7);
      g.gain.setValueAtTime(amp, ctx.currentTime);
      osc.connect(g).connect(master);
      osc.start();
      oscs.push({osc, g, harmonic: h});
    }

    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.linearRampToValueAtTime(baseGain, ctx.currentTime + 0.05);
    master.connect(ctx.destination);
    return { master, oscs };
  }

  function currentRefFreq(){
    return midiToFreq(targetMidi) * Math.pow(2, playOctave);
  }

  function startRefTone(){
    try{
      refAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      refNodes = buildRefTone(currentRefFreq());
      refPlaying = true;
      targetPlayBtn.classList.add('playing');
      targetPlayBtn.textContent = '정지';
    }catch(e){
      refAudioCtx = null; refNodes = null; refPlaying = false;
    }
  }

  function stopRefTone(){
    if(refNodes && refAudioCtx){
      const ctx = refAudioCtx, nodes = refNodes;
      try{
        nodes.master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.05);
      }catch(e){}
      setTimeout(()=>{
        try{ nodes.oscs.forEach(o=>o.osc.stop()); ctx.close(); }catch(e){}
      }, 90);
    }
    refNodes = null; refAudioCtx = null;
    refPlaying = false;
    targetPlayBtn.classList.remove('playing');
    targetPlayBtn.textContent = '재생';
  }

  // retune a playing tone in place when target or octave changes
  function updateRefTone(){
    if(!refPlaying || !refNodes || !refAudioCtx) return;
    const f = currentRefFreq();
    const now = refAudioCtx.currentTime;
    try{
      refNodes.oscs.forEach(o=>{
        o.osc.frequency.setValueAtTime(f * o.harmonic, now);
      });
    }catch(e){}
  }

  targetPlayBtn.addEventListener('click', ()=>{ refPlaying ? stopRefTone() : startRefTone(); });

  function setMode(m){
    mode = m;
    modeAutoBtn.classList.toggle('active', m==='auto');
    modeTargetBtn.classList.toggle('active', m==='target');
    targetRow.classList.toggle('show', m==='target');
    detectedRow.classList.toggle('show', m==='target');
    octaveRow.classList.toggle('show', m==='target');
    if(m==='auto' && refPlaying) stopRefTone();
    hintEl.innerHTML = m==='target'
      ? '◀▶로 타겟 음을 고르고 재생을 누르면 기준음이 납니다. 저음이 잘 안 들리면 재생 옥타브를 +1로 올려서 귀로 맞추세요.'
      : '전체 음역대에서 가장 가까운 반음을 자동으로 잡습니다.<br>기타 줄 이름이 아닌 순수 음이름(C, C#, D…)으로 표시됩니다.';
  }
  modeAutoBtn.addEventListener('click', ()=>setMode('auto'));
  modeTargetBtn.addEventListener('click', ()=>setMode('target'));

  function setInstrument(name){
    inst = name;
    instGuitarBtn.classList.toggle('active', name==='guitar');
    instBassBtn.classList.toggle('active', name==='bass');
    // start at the instrument's open low string (E1 for bass, E2 for guitar)
    targetMidi = RANGES[inst].lo;
    // bass fundamentals are very weak on phone speakers — default to +1 octave
    playOctave = (name==='bass') ? 1 : 0;
    octValEl.textContent = (playOctave>0?'+':'') + playOctave;
    recentMidi.length = 0;
    renderTarget();
  }
  instGuitarBtn.addEventListener('click', ()=>setInstrument('guitar'));
  instBassBtn.addEventListener('click', ()=>setInstrument('bass'));

  document.getElementById('oct-up').addEventListener('click', ()=>{
    playOctave = Math.min(2, playOctave+1);
    octValEl.textContent = (playOctave>0?'+':'') + playOctave;
    updateRefTone();
  });
  document.getElementById('oct-down').addEventListener('click', ()=>{
    playOctave = Math.max(-1, playOctave-1);
    octValEl.textContent = (playOctave>0?'+':'') + playOctave;
    updateRefTone();
  });
})();
</script>
</body>
</html>
